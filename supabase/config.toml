# Supabase Function Configuration
# See: https://supabase.com/docs/guides/functions/function-configuration

# Disable JWT verification for account email function
# This function is called from the app with a valid session token,
# but JWT verification can fail during edge cases like account deletion
[functions.send-account-email]
verify_jwt = false

# RevenueCat sends a shared-secret Authorization header, not a Supabase JWT.
# The function performs its own Bearer token check against
# REVENUECAT_WEBHOOK_SECRET.
[functions.revenuecat-webhook]
verify_jwt = false

# Client purchase/restore sync requires a valid Supabase user JWT. The
# function performs its own auth.getUser() check before any service-role work.
[functions.sync-revenuecat-access]
verify_jwt = true

# App-originated team notifications require a valid Supabase user session.
[functions.team-notification]
verify_jwt = true
