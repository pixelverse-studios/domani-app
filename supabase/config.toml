# Supabase Function Configuration
# See: https://supabase.com/docs/guides/functions/function-configuration

# Account email requests require the caller's Supabase session JWT.
[functions.send-account-email]
verify_jwt = true

# RevenueCat sends a shared-secret Authorization header, not a Supabase JWT.
# The function performs its own Bearer token check against
# REVENUECAT_WEBHOOK_SECRET.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.sync-revenuecat-access]
verify_jwt = true

[functions.reconcile-revenuecat-access]
verify_jwt = false

# App-originated team notifications require a valid Supabase user session.
[functions.team-notification]
verify_jwt = true
