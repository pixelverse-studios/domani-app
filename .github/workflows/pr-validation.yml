name: PR validation

on:
  pull_request:
    branches:
      - dev/**
      - epic/**

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, Jest, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Jest
        run: npm run test:ci

      - name: Lint
        run: npm run lint
